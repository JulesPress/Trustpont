[theme]
base = "light"
primaryColor = "#0F3F3F"
backgroundColor = "#EEF1E0"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F2E2E"
linkColor = "#0F3F3F"
borderColor = "rgba(120,120,120,0.28)"
showWidgetBorder = true
baseRadius = "large"
font = "sans-serif"

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
